# =============================================================================
# Mosquitto MQTT Broker Configuration
# edgekit-server
# =============================================================================

# Persistence
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# --- Plain MQTT listener (internal cluster use) ---
listener 1883
protocol mqtt
allow_anonymous true

# --- WebSocket listener (for browser / WS clients) ---
listener 9001
protocol websockets
allow_anonymous true
